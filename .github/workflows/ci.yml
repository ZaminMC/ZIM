name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  platform-seam:
    name: Platform seam guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard platform seam
        run: ./scripts/ci/guard-platform-seam.sh

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Newer toolchains: `cargo test --workspace` no longer links bin-only
      # crates that carry no test targets (fake-mc-server among them), so
      # the CLI e2e harness finds no binaries to drive — build first.
      - name: Build the workspace bins
        run: cargo build --workspace
      - name: Tests
        run: cargo test --workspace
