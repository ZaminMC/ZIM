name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  platform-seam:
    name: Platform seam guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard platform seam
        run: ./scripts/ci/guard-platform-seam.sh

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Newer toolchains: `cargo test --workspace` no longer links bin-only
      # crates that carry no test targets (fake-mc-server among them), so
      # the CLI e2e harness finds no binaries to drive — build first.
      - name: Build the workspace bins
        run: cargo build --workspace
      - name: Tests
        run: cargo test --workspace

  shell:
    # The Tauri host lives OUTSIDE the workspace (root Cargo.toml
    # excludes it), so the workspace jobs above never compile it — that
    # gap let the shell rot through several green CIs while every
    # release build failed. This job is the shell's own gate: fmt,
    # clippy, and a full check of the host crate, with the same
    # sidecar/frontend staging the release build uses.
    name: Shell compile gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/panel/src-tauri
      - name: System dependencies (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Build the sidecar binaries
        run: cargo build --release -p zamind -p zamin-cli
      - name: Stage the sidecars (the context macro embeds their paths)
        run: |
          mkdir -p apps/panel/src-tauri/binaries
          cp "target/release/zamind${{ matrix.ext }}" \
             "apps/panel/src-tauri/binaries/zamind-${{ matrix.triple }}${{ matrix.ext }}"
          cp "target/release/zamin${{ matrix.ext }}" \
             "apps/panel/src-tauri/binaries/zamin-${{ matrix.triple }}${{ matrix.ext }}"
      - name: Panel frontend build (also feeds the host's context macro)
        run: npm ci && npm run build
        working-directory: apps/panel
      - name: Format (the shell crate)
        working-directory: apps/panel/src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy (the shell crate)
        working-directory: apps/panel/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # The compile gate caught the shell's rot only at the spelling
      # level — tests kept rotting behind green CIs (the omnibox's
      # bare-port law and three pinned-block tests failed for weeks
      # unrun). The gate now executes the laws too.
      - name: Tests (the shell crate)
        working-directory: apps/panel/src-tauri
        run: cargo test
