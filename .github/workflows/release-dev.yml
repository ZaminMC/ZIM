# Release (development channel): build the installers, sign them with the
# updater key, and publish them to the PUBLIC releases repo
# (ZaminMC/ZaminPanel-Releases) as VERSIONED PRE-RELEASES — vMAJOR.MINOR.PATCH
# (ADR-0029) — while the fixed `dev` tag keeps its role as the update
# manifest anchor: the one URL the installed fleet polls
# (…/releases/download/dev/latest.json), rewritten in place every release.
# The code repo stays private; the channel must not.
#
# Version discipline (ADR-0029):
#   v0.1.0  first usable engine          v1.0.0  production release
#   v0.2.0  major subsystem additions    v1.1.0  backwards-compatible features
#   v0.9.0  feature complete / compat    v1.1.1  bug fix
# A version is published at most once: the updater offers an update only
# when the manifest's version is GREATER than the installed one, so
# re-publishing the same version silently no-ops for the fleet. This
# workflow refuses a downgrade or an overwrite unless `allow_republish`
# is set (for re-rolling a broken release); the honest fix is always
# "bump the patch".

name: Release (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH, e.g. 0.2.0 — a leading v is accepted)"
        required: true
        type: string
      allow_republish:
        description: "Permit overwriting an existing v-tag / non-increasing version (re-roll a broken release)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-dev
  cancel-in-progress: false

env:
  RELEASES_REPO: ZaminMC/ZaminPanel-Releases
  ANCHOR_TAG: dev

jobs:
  version:
    name: Stamp the build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - id: stamp
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="${VERSION_INPUT#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (optionally v-prefixed), got '$VERSION_INPUT'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  linux:
    name: AppImage + portable tar.gz, signed
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json

      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            desktop-file-utils

      - name: Stamp the version into the bundle
        working-directory: apps/panel/src-tauri
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync("tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            console.log("version:", conf.version);
          '

      - name: Build the daemon, CLI, and agent (release)
        run: cargo build --release -p zamind -p zamin-cli -p zamin-agent

      - name: Panel frontend build (also feeds the host's context macro)
        run: npm ci && npm run build
        working-directory: apps/panel

      - name: Stage sidecar binaries
        run: |
          mkdir -p apps/panel/src-tauri/binaries
          cp target/release/zamind apps/panel/src-tauri/binaries/zamind-x86_64-unknown-linux-gnu
          cp target/release/zamin apps/panel/src-tauri/binaries/zamin-x86_64-unknown-linux-gnu

      - name: Bundle (AppImage, signed)
        working-directory: apps/panel
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx @tauri-apps/cli@2 build

      - name: Stage the host binary beside the workspace ones
        run: |
          # The Tauri host builds into its own target dir (ADR-0008); the
          # portable payload wants all four binaries in one place.
          cp apps/panel/src-tauri/target/release/zamin-panel target/release/zamin-panel

      - name: Portable archive
        run: ./scripts/packaging/make-portable.sh target/release "$VERSION" bundle-out

      - name: Collect artifacts
        run: |
          mkdir -p bundle-out
          cp apps/panel/src-tauri/target/release/bundle/appimage/*.AppImage bundle-out/
          cp apps/panel/src-tauri/target/release/bundle/appimage/*.AppImage.sig bundle-out/
          ls -la bundle-out

      - uses: actions/upload-artifact@v4
        with:
          name: zaminpanel-linux-${{ env.VERSION }}
          path: |
            bundle-out/*.AppImage
            bundle-out/*.AppImage.sig
            bundle-out/*.tar.gz
          if-no-files-found: error

  windows:
    name: NSIS installer + portable zip, signed
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json

      - name: Stamp the version into the bundle
        working-directory: apps/panel/src-tauri
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync("tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            console.log("version:", conf.version);
          '

      - name: Build the daemon, CLI, and agent (release)
        run: cargo build --release -p zamind -p zamin-cli -p zamin-agent

      - name: Panel frontend build (also feeds the host's context macro)
        run: npm ci && npm run build
        working-directory: apps/panel

      - name: Stage sidecar binaries
        run: |
          New-Item -ItemType Directory -Force -Path apps/panel/src-tauri/binaries | Out-Null
          Copy-Item target/release/zamind.exe apps/panel/src-tauri/binaries/zamind-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/zamin.exe apps/panel/src-tauri/binaries/zamin-x86_64-pc-windows-msvc.exe

      - name: Bundle (NSIS, signed)
        working-directory: apps/panel
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx @tauri-apps/cli@2 build

      - name: Stage the host binary beside the workspace ones
        shell: bash
        run: |
          # The Tauri host builds into its own target dir (ADR-0008); the
          # portable payload wants all four binaries in one place.
          cp apps/panel/src-tauri/target/release/zamin-panel.exe target/release/zamin-panel.exe

      - name: Portable archive
        run: ./scripts/packaging/make-portable.ps1 -BinsDir target/release -Version $env:VERSION -OutDir bundle-out
        env:
          VERSION: ${{ env.VERSION }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle-out | Out-Null
          Copy-Item apps/panel/src-tauri/target/release/bundle/nsis/*.exe bundle-out/
          Copy-Item apps/panel/src-tauri/target/release/bundle/nsis/*.sig bundle-out/
          Get-ChildItem bundle-out

      - uses: actions/upload-artifact@v4
        with:
          name: zaminpanel-windows-${{ env.VERSION }}
          path: |
            bundle-out/*.exe
            bundle-out/*.sig
            bundle-out/*.zip
          if-no-files-found: error

  publish:
    name: Publish the versioned pre-release + refresh the manifest anchor
    runs-on: ubuntu-latest
    needs: [version, linux, windows]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      ALLOW_REPUBLISH: ${{ inputs.allow_republish }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the signed artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Refuse a downgrade or an overwrite (updater honesty)
        run: |
          set -euo pipefail
          export GH_REPO="$RELEASES_REPO"
          if [ "$ALLOW_REPUBLISH" = "true" ]; then
            echo "allow_republish set — the guard steps aside."
            exit 0
          fi
          # The anchor manifest carries the last published version.
          OLD=$(curl -fsSL \
            "https://github.com/$RELEASES_REPO/releases/download/$ANCHOR_TAG/latest.json" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' \
            || echo "0.0.0")
          echo "last published: $OLD — this run: $VERSION"
          if [ "$VERSION" = "$OLD" ]; then
            echo "::error::v$VERSION is already published — the updater compares versions, so a re-publish would no-op for the fleet. Bump the patch (or set allow_republish to re-roll)."
            exit 1
          fi
          HIGHEST=$(printf '%s\n' "$OLD" "$VERSION" | sort -V | tail -n 1)
          if [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::v$VERSION is LOWER than the published v$OLD — the updater would (correctly) ignore it. Bump the version."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG already exists — bump the version (or set allow_republish to re-roll it)."
            exit 1
          fi

      - name: Generate the updater manifest (latest.json)
        run: |
          node scripts/packaging/make-updater-json.mjs \
            --version "$VERSION" \
            --notes "ZaminPanel v$VERSION (development pre-release) from commit $GITHUB_SHA (develop). Auto-update picks this up in-app." \
            --base-url "https://github.com/$RELEASES_REPO/releases/download/$RELEASE_TAG" \
            --out latest.json \
            --entry "windows-x86_64=$(find assets -name '*-setup.exe' | head -n 1)" \
            --entry "linux-x86_64=$(find assets -name '*.AppImage' | head -n 1)"

      - name: Publish the versioned pre-release (assets + manifest)
        run: |
          set -euo pipefail
          export GH_REPO="$RELEASES_REPO"
          gh release create "$RELEASE_TAG" \
            --title "ZaminPanel v$VERSION — development pre-release" \
            --notes "Development pre-release v$VERSION from commit ${GITHUB_SHA::7} on the develop branch.

          Installers: the NSIS setup (Windows 10/11) and the AppImage (Linux) are signed — the panel verifies them before applying an update. The portable archives (zip / tar.gz) carry the daemon and CLI without installing anything. Older builds update themselves to this release through the built-in updater.

          This channel is pre-release software; versions follow vMAJOR.MINOR.PATCH (ADR-0029)." \
            --prerelease \
            assets/* latest.json
          echo "--- published ---"
          gh release view "$RELEASE_TAG" --json assets,url --jq '{url, assets: [.assets[].name]}'

      - name: Refresh the manifest anchor (the fixed dev tag)
        run: |
          set -euo pipefail
          export GH_REPO="$RELEASES_REPO"
          # The anchor keeps ONE asset: the manifest, rewritten in place.
          # Its URL never changes, so an installed fleet never needs a new
          # endpoint — it just reads a manifest that now points at v$VERSION.
          gh release upload "$ANCHOR_TAG" latest.json --clobber
          gh release view "$ANCHOR_TAG" --json assets --jq '.assets[].name' \
            | while read -r asset; do
                if [ "$asset" != "latest.json" ]; then
                  gh release delete-asset "$ANCHOR_TAG" "$asset" --yes
                fi
              done
          gh release edit "$ANCHOR_TAG" \
            --title "Update manifest — development channel" \
            --notes "This entry anchors the in-app update lane: its latest.json is the manifest every installed build polls (on boot and every six hours). It currently offers v$VERSION.

          The installers themselves live in the versioned pre-releases (vMAJOR.MINOR.PATCH) — see the repo's releases page."
          echo "--- anchor refreshed ---"
          gh release view "$ANCHOR_TAG" --json assets --jq '[.assets[].name]'
