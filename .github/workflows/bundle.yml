# Bundle: build the shippable artifacts (§23 Phase 7). The proof of done —
# real installs on clean Win11 + Ubuntu/Arch VMs — stays a manual step; this
# workflow proves both lanes build, test, and package the pieces those VMs
# install: the NSIS installer and portable zip (Windows), the AppImage and
# portable tar.gz (Linux), plus the host crate's own gates which the main
# CI cannot run (the host is excluded from the workspace — ADR-0008).

name: Bundle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  VERSION: "0.1.0"

jobs:
  linux:
    name: AppImage + portable tar.gz (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json

      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            shellcheck \
            desktop-file-utils

      - name: Packaging script gates (shellcheck + desktop validation)
        run: |
          shellcheck scripts/packaging/install-linux.sh
          shellcheck scripts/packaging/test-install-linux.sh
          shellcheck scripts/packaging/make-portable.sh
          desktop-file-validate --no-hints scripts/packaging/mc.zamin.panel.desktop

      - name: install-linux.sh round trip
        run: ./scripts/packaging/test-install-linux.sh

      - name: Build the daemon and CLI (release)
        run: cargo build --release -p zamind -p zamin-cli

      - name: Panel frontend build (also feeds the host's context macro)
        run: npm ci && npm run build
        working-directory: apps/panel

      - name: Stage sidecar binaries
        run: |
          mkdir -p apps/panel/src-tauri/binaries
          cp target/release/zamind apps/panel/src-tauri/binaries/zamind-x86_64-unknown-linux-gnu
          cp target/release/zamin apps/panel/src-tauri/binaries/zamin-x86_64-unknown-linux-gnu

      - name: Host gates (clippy + tests)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
        working-directory: apps/panel/src-tauri

      - name: Bundle (AppImage)
        run: npx @tauri-apps/cli@2 build
        working-directory: apps/panel

      - name: Portable archive
        run: ./scripts/packaging/make-portable.sh target/release "$VERSION" bundle-out

      - name: Collect artifacts
        run: |
          mkdir -p bundle-out
          cp apps/panel/src-tauri/target/release/bundle/appimage/*.AppImage bundle-out/
          ls -la bundle-out

      - uses: actions/upload-artifact@v4
        with:
          name: zaminpanel-linux
          path: bundle-out/*

  windows:
    name: NSIS installer + portable zip (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/panel/package-lock.json

      - name: Build the daemon and CLI (release)
        run: cargo build --release -p zamind -p zamin-cli

      - name: Panel frontend build (also feeds the host's context macro)
        run: npm ci && npm run build
        working-directory: apps/panel

      - name: Stage sidecar binaries
        run: |
          New-Item -ItemType Directory -Force -Path apps/panel/src-tauri/binaries | Out-Null
          Copy-Item target/release/zamind.exe apps/panel/src-tauri/binaries/zamind-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/zamin.exe apps/panel/src-tauri/binaries/zamin-x86_64-pc-windows-msvc.exe

      - name: Host gates (clippy + tests)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
        working-directory: apps/panel/src-tauri

      - name: Bundle (NSIS)
        run: npx @tauri-apps/cli@2 build
        working-directory: apps/panel

      - name: Portable archive
        run: ./scripts/packaging/make-portable.ps1 -BinsDir target/release -Version $env:VERSION -OutDir bundle-out
        env:
          VERSION: ${{ env.VERSION }}

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path bundle-out | Out-Null
          Copy-Item apps/panel/src-tauri/target/release/bundle/nsis/*.exe bundle-out/
          Get-ChildItem bundle-out

      - uses: actions/upload-artifact@v4
        with:
          name: zaminpanel-windows
          path: bundle-out/*
