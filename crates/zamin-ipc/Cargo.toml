[package]
name = "zamin-ipc"
description = "Zamin Protocol local transports: framed connections over named pipes and Unix sockets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zamin-protocol = { path = "../zamin-protocol" }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

# Unix daemon ownership: flock on the endpoint's lock file is the atomic
# single-instance primitive (the Windows side has first_pipe_instance).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
