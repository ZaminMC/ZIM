<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIM</title>
    <!-- White before the CSS lands (the official theme): a tab
         webview's first paint is the page's canvas color, and a flash
         of any other ground reads as a glitch. -->
    <style>html { background: #ffffff; }</style>
    <!-- THE SPLASH (the premium first beat the founder asked for): the
         boot splash stands over the app's own WHITE ground until the
         app's first commit, then cross-fades away. Every rule it needs
         — including the fade classes main.tsx drives — lives HERE,
         inline, in this document: a splash whose retirement depends on
         a stylesheet that may never load is exactly how the frame band
         was lost (2026-10-12), and that class of bug dies here. -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #202124;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      .boot-splash svg {
        width: 44px;
        height: 44px;
      }
      .boot-splash .boot-word {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #5f6368;
        text-transform: uppercase;
      }
      .boot-splash .boot-line {
        position: relative;
        width: 148px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background: rgba(95, 99, 104, 0.25);
      }
      .boot-splash .boot-line::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 1px;
        background: #1a73e8;
        animation: boot-slide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      /* The retirement lanes (main.tsx adds the classes after the app's
         first commit): a fade, never a pop — then the node leaves the
         tree entirely. Both selectors are written so whichever element
         carries the class, the law holds. */
      .boot-splash.boot-done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.32s ease;
      }
      #boot.boot-gone,
      .boot-splash.boot-gone {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash .boot-line::after {
          animation: none;
        }
        .boot-splash.boot-done {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-splash">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect
            x="5"
            y="5"
            width="38"
            height="38"
            rx="9"
            stroke="rgba(32,33,36,0.22)"
            stroke-width="2"
          />
          <path
            d="M17.5 19h13l-13 10h13"
            stroke="#1a73e8"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="boot-word">ZIM</span>
        <span class="boot-line"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
