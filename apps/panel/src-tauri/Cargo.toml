[package]
name = "zim-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ZaminMC/ZIM"
description = "ZIM desktop shell: a thin Tauri 2 host bridging the webview to the daemon's local transport (ADR-0003)."

[[bin]]
name = "zim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# The bridge logic (framing, coalescing, down signals, the remote
# resolver) is tested in the workspace crate; this host only wires it to
# the webview channels.
zamin-bridge = { path = "../../../crates/zamin-bridge" }
zamin-agent = { path = "../../../crates/zamin-agent" }
zamin-ipc = { path = "../../../crates/zamin-ipc" }
# The log folder's platform path (the daemon's data dir) — the shared
# seam, not new business logic.
zamin-core = { path = "../../../crates/zamin-core" }
tracing = "0.1"

# Desktop notifications (freedesktop / Windows toast): the webview decides
# the taxonomy, this plugin performs the OS call.
tauri-plugin-notification = "2"

# The development channel's update lane (ADR-0024): the updater checks the
# public releases repo's latest.json, verifies the minisign signature, and
# swaps the bundle; the process plugin performs the final relaunch. The
# webview owns every decision — when to check, what "automatic" means —
# the plugins only perform the OS calls.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Feedback (ADR-0028): the webview composes the issue and decides the
# route; the opener plugin performs the OS "open the browser" call, and
# the clipboard plugin hands a pasted screenshot back to the operator's
# clipboard for the GitHub form's own paste-attach.
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

# Login autostart (HKCU Run key) — the Windows half of the §12.1 seam.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
strip = true
